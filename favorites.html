<!DOCTYPE html>
<html lang="en">

<head>

</head>

<body>

    <header>
        <a href="index.html" class="logo">Boni's Logs</a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="favorites.html" class="active">Favorites</a></li>
                <li><a href="about.html">About</a></li>

    <main>
        <section class="hero" style="border-style: dotted;">
